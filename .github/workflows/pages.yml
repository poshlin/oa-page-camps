# GitHub Pages 預覽（給保旭看稿用，不是正式站）
# 🔴 預覽站掛在 https://poshlin.github.io/oa-page-camps/ 底下，
#    所以資產前綴要用 OA_BASE=/oa-page-camps 覆蓋掉正式站的 /camps。
name: Pages 預覽
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 建置（預覽前綴）
        run: OA_BASE=/oa-page-camps npm run build
      - name: 驗收
        run: OA_BASE=/oa-page-camps npm test
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
